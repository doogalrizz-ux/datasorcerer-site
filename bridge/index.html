<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAY Bridge Bidding Trainer — datasorcerer.net</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0b0e17;
      --surface:  #131722;
      --surface2: #1a2035;
      --felt:     #1a3a2a;
      --felt2:    #14301f;
      --gold:     #c9a84c;
      --gold-lt:  #f0c84a;
      --text:     #d4d8e8;
      --muted:    #7a8099;
      --border:   #1e2a40;
      --red:      #e74c3c;
      --red-lt:   #ff6b6b;
      --pass:     #2ecc71;
      --fail:     #e74c3c;
      --card-bg:  #f8f4ec;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--gold);
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .bridge-logo {
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      color: var(--gold-lt);
      font-family: 'Georgia', serif;
    }

    header h1 {
      font-size: 1rem;
      font-weight: normal;
      color: var(--text);
      flex: 1;
    }

    .sayc-badge {
      font-family: monospace;
      font-size: 0.7rem;
      background: var(--gold);
      color: #000;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-weight: bold;
      letter-spacing: 0.1em;
    }

    header .site-link {
      font-family: monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── Progress bar ────────────────────────────────── */
    .progress-wrap {
      background: var(--surface);
      padding: 0.6rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .progress-label {
      font-family: monospace;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
    }

    .progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 2px;
      transition: width 0.4s;
    }

    .score-label {
      font-family: monospace;
      font-size: 0.78rem;
      color: var(--gold);
      white-space: nowrap;
    }

    /* ── Main layout ─────────────────────────────────── */
    .game-area {
      flex: 1;
      display: grid;
      grid-template-columns: 220px 1fr 280px;
      gap: 0;
      min-height: 0;
    }

    /* ── Hand panel ──────────────────────────────────── */
    .hand-panel {
      background: var(--felt);
      border-right: 1px solid rgba(255,255,255,0.08);
      padding: 1.5rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-label {
      font-family: monospace;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 0.25rem;
    }

    .hand-display {
      background: var(--card-bg);
      border-radius: 6px;
      padding: 1rem 1.1rem;
      color: #1a1a1a;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      line-height: 2;
    }

    .suit-row { display: flex; align-items: baseline; gap: 0.4rem; }
    .suit-sym { font-size: 1.15rem; font-weight: bold; min-width: 1.2rem; }
    .suit-sym.red { color: var(--red); }
    .suit-sym.black { color: #1a1a1a; }
    .suit-cards { letter-spacing: 0.05em; font-size: 0.95rem; }

    .hand-info {
      font-family: monospace;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.8;
    }

    .hand-info strong { color: var(--gold); }

    /* ── Center panel ────────────────────────────────── */
    .center-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* Auction table */
    .auction-wrap {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .auction-table {
      width: 100%;
      border-collapse: collapse;
      font-family: monospace;
    }

    .auction-table th {
      padding: 0.3rem 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.1em;
    }

    .auction-table th.you {
      color: var(--gold);
    }

    .auction-table td {
      padding: 0.35rem 0.5rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text);
    }

    .auction-table td.you-cell {
      color: var(--gold-lt);
      font-weight: bold;
    }

    .bid-call { white-space: nowrap; }
    .bid-call.red-bid { color: var(--red-lt); }
    .bid-call.pass-bid { color: var(--muted); font-style: italic; }
    .bid-call.x-bid { color: var(--red-lt); font-weight: bold; }
    .bid-call.question { color: var(--gold-lt); font-size: 1.1rem; }

    /* Category / vul row */
    .context-row {
      padding: 0.5rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 1.5rem;
      font-family: monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .context-row span strong { color: var(--text); }

    .vul-none { color: var(--muted); }
    .vul-ns   { color: var(--red-lt); }
    .vul-ew   { color: #f39c12; }
    .vul-both { color: var(--red-lt); }

    /* Feedback area */
    .feedback-wrap {
      flex: 1;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .feedback-idle {
      color: var(--muted);
      font-family: monospace;
      font-size: 0.85rem;
      text-align: center;
    }

    .feedback-result {
      display: none;
    }

    .feedback-result.visible { display: block; }

    .verdict-banner {
      padding: 0.85rem 1.1rem;
      border-radius: 5px;
      font-size: 1rem;
      font-family: 'Georgia', serif;
      margin-bottom: 1rem;
    }

    .verdict-banner.correct {
      background: rgba(46,204,113,0.12);
      border: 1px solid var(--pass);
      color: var(--pass);
    }

    .verdict-banner.wrong {
      background: rgba(231,76,60,0.10);
      border: 1px solid var(--fail);
      color: #f09090;
    }

    .verdict-you {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .verdict-explanation {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.6;
    }

    .verdict-accepted {
      margin-top: 0.6rem;
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .btn-next {
      margin-top: 1.2rem;
      padding: 0.7rem 2rem;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 4px;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-next:hover { background: var(--gold-lt); }

    /* ── Bidding box panel ───────────────────────────── */
    .bid-panel {
      background: var(--surface2);
      border-left: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .bid-panel .panel-label { color: rgba(255,255,255,0.35); }

    .special-bids {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.35rem;
      margin-bottom: 0.35rem;
    }

    .bid-level {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.35rem;
    }

    .bid-btn {
      padding: 0.55rem 0.2rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
      color: var(--text);
      font-family: monospace;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
      transition: background 0.1s, border-color 0.1s;
      user-select: none;
    }

    .bid-btn:hover:not(:disabled):not(.bid-disabled) {
      background: var(--surface2);
      border-color: var(--gold);
      color: var(--gold-lt);
    }

    .bid-btn.bid-disabled {
      opacity: 0.22;
      cursor: not-allowed;
    }

    .bid-btn.bid-selected {
      background: var(--gold);
      color: #000;
      border-color: var(--gold-lt);
      font-weight: bold;
    }

    .bid-btn.suit-h, .bid-btn.suit-d { color: var(--red-lt); }
    .bid-btn.suit-h.bid-selected, .bid-btn.suit-d.bid-selected { color: #000; }

    .bid-btn.pass-btn { color: var(--muted); }
    .bid-btn.x-btn { color: var(--red-lt); font-weight: bold; }
    .bid-btn.xx-btn { color: var(--red-lt); }

    .bid-confirm {
      margin-top: 0.5rem;
      padding: 0.65rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      font-family: monospace;
      font-size: 0.78rem;
      text-align: center;
    }

    .bid-confirm.has-selection {
      border-color: var(--gold);
      color: var(--text);
    }

    .btn-submit {
      width: 100%;
      margin-top: 0.4rem;
      padding: 0.7rem;
      background: var(--felt2);
      border: 1px solid var(--gold);
      border-radius: 4px;
      color: var(--gold);
      font-family: 'Georgia', serif;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-submit:hover:not(:disabled) { background: var(--felt); }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Game over screen ────────────────────────────── */
    #screen-gameover {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      padding: 3rem;
      text-align: center;
    }

    #screen-gameover.visible { display: flex; }

    #screen-gameover h2 {
      font-size: 2rem;
      color: var(--gold-lt);
      font-weight: normal;
    }

    .final-score-display {
      font-family: monospace;
      font-size: 3.5rem;
      color: var(--gold-lt);
    }

    .score-breakdown {
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 2;
      max-width: 500px;
      text-align: left;
    }

    .score-breakdown .wrong-item { color: var(--red-lt); }
    .score-breakdown .right-item { color: var(--pass); }

    .btn-restart {
      padding: 0.8rem 2.5rem;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 4px;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-restart:hover { background: var(--gold-lt); }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 800px) {
      .game-area { grid-template-columns: 1fr; grid-template-rows: auto; }
      .bid-panel { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <div class="bridge-logo">♠♥♦♣</div>
  <h1>Standard American Yellow Card — Bidding Trainer</h1>
  <span class="sayc-badge">SAYC</span>
  <span class="site-link">datasorcerer.net</span>
</header>

<div class="progress-wrap">
  <span class="progress-label" id="progress-label">Question 1 of 10</span>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <span class="score-label" id="score-label">0 / 0</span>
</div>

<div class="game-area" id="game-area">

  <!-- Hand panel -->
  <div class="hand-panel">
    <div>
      <div class="panel-label">Your Hand</div>
      <div class="hand-display" id="hand-display"></div>
    </div>
    <div class="hand-info" id="hand-info"></div>
  </div>

  <!-- Center panel -->
  <div class="center-panel">
    <div class="auction-wrap">
      <div class="panel-label" style="margin-bottom:0.5rem">Auction</div>
      <table class="auction-table" id="auction-table">
        <thead><tr>
          <th id="th-N">N</th><th id="th-E">E</th><th id="th-S">S</th><th id="th-W">W</th>
        </tr></thead>
        <tbody id="auction-body"></tbody>
      </table>
    </div>

    <div class="context-row" id="context-row"></div>

    <div class="feedback-wrap">
      <div class="feedback-idle" id="feedback-idle">Select your bid from the bidding box →</div>
      <div class="feedback-result" id="feedback-result">
        <div class="verdict-banner" id="verdict-banner"></div>
        <div class="verdict-you" id="verdict-you"></div>
        <div class="verdict-explanation" id="verdict-explanation"></div>
        <div class="verdict-accepted" id="verdict-accepted"></div>
        <button class="btn-next" id="btn-next" onclick="nextQuestion()">Next Question →</button>
      </div>
    </div>
  </div>

  <!-- Bidding box panel -->
  <div class="bid-panel">
    <div class="panel-label">Bidding Box</div>

    <div class="special-bids">
      <button class="bid-btn pass-btn" id="bid-P" onclick="selectBid('P')">Pass</button>
      <button class="bid-btn x-btn"    id="bid-X" onclick="selectBid('X')">Dbl</button>
      <button class="bid-btn xx-btn"   id="bid-XX" onclick="selectBid('XX')">Rdbl</button>
    </div>

    <div id="bid-levels"></div>

    <div class="bid-confirm" id="bid-confirm">— no bid selected —</div>
    <button class="btn-submit" id="btn-submit" onclick="submitBid()" disabled>Submit Bid</button>
  </div>

</div>

<!-- Game over screen -->
<div id="screen-gameover">
  <h2>Session Complete</h2>
  <div class="final-score-display" id="final-score-display">0 / 10</div>
  <div class="score-breakdown" id="score-breakdown"></div>
  <button class="btn-restart" onclick="initSession()">New Session</button>
</div>

<script>
// ── Suit helpers ──────────────────────────────────────────────────────────────
const SYM = {S:'♠', H:'♥', D:'♦', C:'♣', N:'NT'};
const RED_SUITS = new Set(['H','D']);

function bidLabel(b) {
  if (b === 'P')  return 'Pass';
  if (b === 'X')  return 'Dbl';
  if (b === 'XX') return 'Rdbl';
  const level = b[0], suit = b[1];
  return level + (suit === 'N' ? 'NT' : SYM[suit]);
}

function bidClass(b) {
  if (b === 'P')  return 'pass-bid';
  if (b === 'X')  return 'x-bid';
  if (b === 'XX') return 'x-bid';
  if (RED_SUITS.has(b[1])) return 'red-bid';
  return '';
}

// ── Bid ordering ──────────────────────────────────────────────────────────────
const BID_ORDER = [];
for (let lv = 1; lv <= 7; lv++) {
  for (const s of ['C','D','H','S','N']) {
    BID_ORDER.push(lv + s);
  }
}

function bidRank(b) { return BID_ORDER.indexOf(b); }

function highestBid(auction) {
  let max = -1;
  for (const b of auction) {
    const r = bidRank(b);
    if (r > max) max = r;
  }
  return max;
}

// ── Seat utilities ────────────────────────────────────────────────────────────
const SEATS = ['N','E','S','W'];
function seatIdx(s) { return SEATS.indexOf(s); }
function partnerOf(s) { return {N:'S',S:'N',E:'W',W:'E'}[s]; }
function isOpponent(bidSeat, playerSeat) {
  return bidSeat !== playerSeat && bidSeat !== partnerOf(playerSeat);
}
function seatAtIdx(dealer, i) {
  return SEATS[(seatIdx(dealer) + i) % 4];
}

function canDouble(auction, dealer, playerSeat) {
  for (let i = auction.length - 1; i >= 0; i--) {
    const b = auction[i];
    if (b === 'P') continue;
    if (b === 'X' || b === 'XX') return false;
    return isOpponent(seatAtIdx(dealer, i), playerSeat);
  }
  return false;
}

function canRedouble(auction, dealer, playerSeat) {
  for (let i = auction.length - 1; i >= 0; i--) {
    const b = auction[i];
    if (b === 'P') continue;
    if (b !== 'X') return false;
    return isOpponent(seatAtIdx(dealer, i), playerSeat);
  }
  return false;
}

// ── HCP counter ───────────────────────────────────────────────────────────────
function countHCP(hand) {
  const pts = {A:4,K:3,Q:2,J:1};
  let total = 0;
  for (const suit of ['S','H','D','C']) {
    for (const card of (hand[suit] || '')) {
      total += pts[card] || 0;
    }
  }
  return total;
}

// ── 100 SAYC Scenarios ────────────────────────────────────────────────────────
// hand: {S:'AK5', H:'Q93', D:'KJ72', C:'Q84'}  (ranks A K Q J T 9 ... 2)
// dlr: dealer seat, seat: player seat
// vul: 'none'|'NS'|'EW'|'both'
// auction: bids in rotation from dealer, before player's turn
// ok: array of acceptable bids
// why: explanation shown after bidding

const SCENARIOS = [
// ── OPENING BIDS (1-25) ─────────────────────────────────────────────────────
{id:1, cat:'Opening Bids',
 hand:{S:'AQ5',H:'KJ3',D:'KJ52',C:'Q84'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['1N'],
 why:'16 HCP, balanced 4-3-3-3 with no 5-card major. Open 1NT, precisely describing 15–17 HCP balanced.'},

{id:2, cat:'Opening Bids',
 hand:{S:'KQ5',H:'AJ3',D:'Q752',C:'K84'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['1N'],
 why:'15 HCP, balanced 3-3-4-3. No 5-card major, one doubleton is fine for 1NT. Open 1NT.'},

{id:3, cat:'Opening Bids',
 hand:{S:'AJ54',H:'KQ3',D:'Q72',C:'AJ9'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['1N'],
 why:'17 HCP, balanced 4-3-3-3. Top of the 1NT range — still correct to open 1NT. A rebid of 1NT would undercount; 2NT would overcount.'},

{id:4, cat:'Opening Bids',
 hand:{S:'K54',H:'Q93',D:'Q752',C:'K84'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['P'],
 why:'10 HCP — below the SAYC minimum of 12 HCP to open. Pass and wait for a better hand.'},

{id:5, cat:'Opening Bids',
 hand:{S:'Q54',H:'J93',D:'KJ52',C:'Q84'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['P'],
 why:'9 HCP with no shape advantage. Pass. Opening light invites trouble and rarely gains.'},

{id:6, cat:'Opening Bids',
 hand:{S:'KQJ95',H:'A43',D:'K72',C:'84'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['1S'],
 why:'13 HCP with a 5-card spade suit. SAYC requires 5 cards to open a major. Open 1♠.'},

{id:7, cat:'Opening Bids',
 hand:{S:'A43',H:'KJ975',D:'Q72',C:'K4'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['1H'],
 why:'13 HCP with a 5-card heart suit. Open 1♥. Never open 1NT when you have a 5-card major in the 12–17 HCP range.'},

{id:8, cat:'Opening Bids',
 hand:{S:'AKJ95',H:'AQ4',D:'A72',C:'84'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['1S'],
 why:'18 HCP with a 5-card spade suit. Open 1♠ and plan a strong rebid (jump shift or reverse) to show extra values.'},

{id:9, cat:'Opening Bids',
 hand:{S:'KQJ5',H:'AKJ95',D:'3',C:'J84'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['1H'],
 why:'15 HCP with 5 hearts and 4 spades. Open your longest suit: 1♥. Next round bid 1♠ to show the second suit.'},

{id:10, cat:'Opening Bids',
 hand:{S:'AKJ95',H:'KQJ5',D:'3',C:'J84'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['1S'],
 why:'15 HCP with 5 spades and 4 hearts. With 5-4, open the 5-card suit (1♠). You\'ll bid hearts next round.'},

{id:11, cat:'Opening Bids',

 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['1D','1C'],
 why:'14 HCP with no 5-card suit and no 5-card major. With 4 diamonds and 4 clubs, open 1♦ to keep the bidding lower and show diamonds specifically.'},

{id:12, cat:'Opening Bids',
 hand:{S:'K54',H:'A3',D:'KJ975',C:'Q84'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['1D'],
 why:'13 HCP with a 5-card diamond suit. Open 1♦. No 5-card major, so a minor-suit opening is correct.'},

{id:13, cat:'Opening Bids',
 hand:{S:'A54',H:'K32',D:'Q72',C:'KJ98'},
 dlr:'S',seat:'S',vul:'none',auction:[],

{id:14, cat:'Opening Bids',
 hand:{S:'KQJ975',H:'43',D:'A72',C:'65'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['2S'],
 why:'10 HCP with a strong 6-card spade suit. A weak two bid (2♠) shows 6–10 HCP and a good 6-card suit, making life hard for opponents.'},

{id:15, cat:'Opening Bids',
 hand:{S:'A3',H:'KQJ975',D:'72',C:'654'},
 dlr:'S',seat:'S',vul:'none',auction:[],
 ok:['2H'],

// ── Game state ─────────────────────────────────────────────────────────────────
let session = [];
let currentIdx = 0;
let score = 0;
let answered = false;
let selectedBid = null;
let results = []; // {scenario, bid, correct}

function initSession() {
  // Random 10 from 100
  const pool = [...SCENARIOS].sort(() => Math.random() - 0.5).slice(0, 10);
  session = pool;
  currentIdx = 0;
  score = 0;
  answered = false;
  selectedBid = null;
  results = [];

  document.getElementById('game-area').style.display = 'grid';
  document.getElementById('screen-gameover').classList.remove('visible');

  renderScenario();
}

function renderScenario() {
  const s = session[currentIdx];
  answered = false;
  selectedBid = null;

  // Progress
  const q = currentIdx + 1;
  document.getElementById('progress-label').textContent = `Question ${q} of 10`;
  document.getElementById('progress-fill').style.width = `${(currentIdx / 10) * 100}%`;
  document.getElementById('score-label').textContent = `${score} / ${currentIdx}`;

  // Hide feedback
  document.getElementById('feedback-idle').style.display = 'block';
  document.getElementById('feedback-result').classList.remove('visible');

  // Hand
  renderHand(s.hand);

  // Hand info
  const hcp = countHCP(s.hand);
  const dist = ['S','H','D','C'].map(su => (s.hand[su]||'').length).join('-');
  const vulText = {none:'None',NS:'N/S',EW:'E/W',both:'Both'}[s.vul];
  document.getElementById('hand-info').innerHTML =
    `<strong>HCP:</strong> ${hcp}<br>` +
    `<strong>Distribution:</strong> ${dist}<br>` +
    `<strong>You are:</strong> ${s.seat}<br>` +
    `<strong>Dealer:</strong> ${s.dlr}<br>` +
    `<strong>Vulnerable:</strong> ${vulText}`;

  // Auction
  renderAuction(s);

  // Context row
  document.getElementById('context-row').innerHTML =
    `<span>Category: <strong>${s.cat}</strong></span>` +
    `<span>Vulnerability: <strong class="vul-${s.vul}">${vulText}</strong></span>`;

  // Bidding box
  renderBiddingBox(s);
}

function renderHand(hand) {
  const suits = [
    {sym:'♠', key:'S', cls:'black'},
    {sym:'♥', key:'H', cls:'red'},
    {sym:'♦', key:'D', cls:'red'},
    {sym:'♣', key:'C', cls:'black'},
  ];
  const el = document.getElementById('hand-display');
  el.innerHTML = suits.map(({sym,key,cls}) => {
    const cards = (hand[key]||'').split('').join(' ') || '—';
    return `<div class="suit-row">
      <span class="suit-sym ${cls}">${sym}</span>
      <span class="suit-cards">${cards}</span>
    </div>`;
  }).join('');
}

function renderAuction(s) {
  const dlrIdx = seatIdx(s.dlr);
  const allBids = [...s.auction, '?'];
  const tbody = document.getElementById('auction-body');
  tbody.innerHTML = '';

  // Highlight player's column header
  ['N','E','S','W'].forEach(seat => {
    const th = document.getElementById(`th-${seat}`);
    th.className = seat === s.seat ? 'you' : '';
    th.textContent = seat === s.seat ? `${seat} (You)` : seat;
  });

  // Build grid
  const numCells = dlrIdx + allBids.length;
  const numRows = Math.ceil(numCells / 4);
  const grid = Array.from({length: numRows}, () => Array(4).fill(null));

  allBids.forEach((bid, i) => {
    const absIdx = dlrIdx + i;
    grid[Math.floor(absIdx / 4)][absIdx % 4] = bid;
  });

  grid.forEach(row => {
    const tr = document.createElement('tr');
    row.forEach((cell, colIdx) => {
      const td = document.createElement('td');
      const colSeat = SEATS[colIdx];
      if (cell === null) {
        td.textContent = '';
      } else if (cell === '?') {
        td.className = 'you-cell';
        td.innerHTML = '<span class="bid-call question">?</span>';
      } else {
        const label = bidLabel(cell);
        const cls = bidClass(cell);
        td.innerHTML = `<span class="bid-call ${cls}">${label}</span>`;
      }
      if (colSeat === s.seat) td.classList.add('you-cell');
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function renderBiddingBox(s) {
  const highest = highestBid(s.auction);
  const dbl = canDouble(s.auction, s.dlr, s.seat);
  const rdbl = canRedouble(s.auction, s.dlr, s.seat);

  // Special bids
  document.getElementById('bid-P').classList.remove('bid-disabled','bid-selected');
  const xBtn = document.getElementById('bid-X');
  const xxBtn = document.getElementById('bid-XX');
  xBtn.classList.toggle('bid-disabled', !dbl);
  xxBtn.classList.toggle('bid-disabled', !rdbl);
  xBtn.classList.remove('bid-selected');
  xxBtn.classList.remove('bid-selected');

  // Level buttons
  const container = document.getElementById('bid-levels');
  container.innerHTML = '';

  for (let lv = 7; lv >= 1; lv--) {
    const row = document.createElement('div');
    row.className = 'bid-level';
    for (const suit of ['C','D','H','S','N']) {
      const bid = lv + suit;
      const btn = document.createElement('button');
      btn.className = 'bid-btn';
      if (RED_SUITS.has(suit)) btn.classList.add(suit === 'H' ? 'suit-h' : 'suit-d');
      btn.id = `bid-${bid}`;
      btn.textContent = bidLabel(bid);
      const disabled = bidRank(bid) <= highest;
      if (disabled) btn.classList.add('bid-disabled');
      btn.onclick = () => selectBid(bid);
      row.appendChild(btn);
    }
    container.appendChild(row);
  }

  document.getElementById('bid-confirm').textContent = '— no bid selected —';
  document.getElementById('bid-confirm').classList.remove('has-selection');
  document.getElementById('btn-submit').disabled = true;
}

function selectBid(bid) {
  if (answered) return;

  // Check disabled
  const s = session[currentIdx];
  if (bid !== 'P') {
    if (bid === 'X' && !canDouble(s.auction, s.dlr, s.seat)) return;
    if (bid === 'XX' && !canRedouble(s.auction, s.dlr, s.seat)) return;
    if (bid !== 'X' && bid !== 'XX') {
      const highest = highestBid(s.auction);
      if (bidRank(bid) <= highest) return;
    }
  }

  // Clear previous selection
  document.querySelectorAll('.bid-btn.bid-selected').forEach(b => b.classList.remove('bid-selected'));

  selectedBid = bid;
  const btn = document.getElementById(`bid-${bid}`);
  if (btn) btn.classList.add('bid-selected');

  const label = bidLabel(bid);
  document.getElementById('bid-confirm').textContent = `Selected: ${label}`;
  document.getElementById('bid-confirm').classList.add('has-selection');
  document.getElementById('btn-submit').disabled = false;
}

function submitBid() {
  if (!selectedBid || answered) return;
  answered = true;
  document.getElementById('btn-submit').disabled = true;

  const s = session[currentIdx];
  const correct = s.ok.includes(selectedBid);
  if (correct) score++;

  results.push({scenario: s, bid: selectedBid, correct});

  // Show feedback
  document.getElementById('feedback-idle').style.display = 'none';
  const resultEl = document.getElementById('feedback-result');
  resultEl.classList.add('visible');

  const banner = document.getElementById('verdict-banner');
  banner.className = 'verdict-banner ' + (correct ? 'correct' : 'wrong');
  banner.textContent = correct
    ? `✓ Correct — ${bidLabel(selectedBid)} is the right bid.`
    : `✗ You bid ${bidLabel(selectedBid)}`;

  document.getElementById('verdict-you').textContent =
    correct ? '' : `Accepted bid${s.ok.length > 1 ? 's' : ''}: ${s.ok.map(bidLabel).join(', ')}`;

  document.getElementById('verdict-explanation').textContent = s.why;
  document.getElementById('verdict-accepted').textContent = '';

  // Update score display
  document.getElementById('score-label').textContent = `${score} / ${currentIdx + 1}`;
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= session.length) {
    showGameOver();
  } else {
    renderScenario();
  }
}

function showGameOver() {
  document.getElementById('game-area').style.display = 'none';
  const go = document.getElementById('screen-gameover');
  go.classList.add('visible');

  document.getElementById('final-score-display').textContent = `${score} / 10`;
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-label').textContent = 'Session complete';
  document.getElementById('score-label').textContent = `${score} / 10`;

  const breakdown = document.getElementById('score-breakdown');
  breakdown.innerHTML = results.map(r => {
    const cls = r.correct ? 'right-item' : 'wrong-item';
    const icon = r.correct ? '✓' : '✗';
    const label = r.scenario.cat + ': ' + r.scenario.why.split('.')[0] + '.';
    const yourBid = `You bid: ${bidLabel(r.bid)}`;
    const accepted = `Accepted: ${r.scenario.ok.map(bidLabel).join(', ')}`;
    return `<div class="${cls}" style="margin-bottom:0.75rem">
      ${icon} Q${r.scenario.id} — ${yourBid} | ${accepted}<br>
      <span style="color:var(--muted);font-size:0.72rem">${label}</span>
    </div>`;
  }).join('');
}

// ── Start ─────────────────────────────────────────────────────────────────────
initSession();
</script>
